[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hammam-wellness-data-quality-pipeline"
version = "0.1.0"
description = "Modular ETL pipeline for wellness center data quality and analytics."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hammam_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]